<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBONARIUM | Цифрова Бібліотека</title>
    <meta name="description"
        content="IBONARIUM - велика онлайн бібліотека з відкритим API. Книги з космосу, історії, філософії та науки.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
</head>

<body>
    <canvas id="starsCanvas"></canvas>

    <div class="app-container">
        <header>
            <div class="logo-container">
                <h1 id="main-title">IBONARIUM</h1>
                <p class="subtitle">Архіви Світової Думки</p>
            </div>

            <nav class="filters-container">
                <div class="filters-scroll">
                    <!-- Special Categories -->
                    <button class="filter-btn active" data-subject="all">Всі</button>
                    <button class="filter-btn special-filter" data-subject="trending">🔥 Популярне</button>

                    <!-- Subjects -->
                    <button class="filter-btn" data-subject="science">Наука</button>
                    <button class="filter-btn" data-subject="publicistics">Публіцистика</button>
                    <button class="filter-btn" data-subject="space">Космос</button>
                    <button class="filter-btn" data-subject="history">Історія</button>
                    <button class="filter-btn" data-subject="ballet">Історія балету</button>
                    <button class="filter-btn" data-subject="middle ages">Середньовіччя</button>
                    <button class="filter-btn" data-subject="classics">Стара література</button>
                    <button class="filter-btn" data-subject="philosophy">Філософія</button>
                    <button class="filter-btn" data-subject="music">Музика</button>
                    <!-- Music Expansion -->
                    <button class="filter-btn" data-subject="opera">Опера</button>
                    <button class="filter-btn" data-subject="classical_music">Класика</button>
                    <button class="filter-btn" data-subject="modern_music">Сучасна музика</button>
                    <button class="filter-btn" data-subject="jazz">Джаз</button>
                    <button class="filter-btn" data-subject="rock">Рок</button>
                    <button class="filter-btn" data-subject="folk">Фолк</button>
                    <button class="filter-btn" data-subject="music_theory">Теорія музики</button>

                    <button class="filter-btn" data-subject="geometry">Геометрія</button>
                    <button class="filter-btn" data-subject="mathematics">Математика</button>
                    <button class="filter-btn" data-subject="literature">Література</button>
                    <button class="filter-btn" data-subject="physics">Фізика</button>
                    <button class="filter-btn" data-subject="quantum physics">Квантова фізика</button>
                    <button class="filter-btn" data-subject="poetry">Поезія</button>

                    <!-- New Categories -->
                    <button class="filter-btn" data-subject="astronomy">Астрономія</button>
                    <button class="filter-btn" data-subject="medicine">Медицина</button>
                    <button class="filter-btn" data-subject="biology">Біологія</button>
                    <!-- Ukrainian Removed -->
                    <button class="filter-btn" data-subject="atlases">Атласи старого світу</button>
                    <button class="filter-btn" data-subject="greece">Історія Греції</button>
                    <button class="filter-btn" data-subject="rome">Історія Риму</button>
                    <button class="filter-btn" data-subject="technology">Технології</button>
                    <button class="filter-btn" data-subject="comms">Зв'язок</button>
                    <button class="filter-btn" data-subject="ornithology">Орнітологія</button>
                    <button class="filter-btn" data-subject="scifi">Фантастика</button>
                    <button class="filter-btn" data-subject="politics">Політика</button>
                    <button class="filter-btn" data-subject="law">Право</button>
                    <button class="filter-btn" data-subject="economics">Економіка</button>

                    <!-- User Requested & Expanded -->
                    <button class="filter-btn" data-subject="recreation">Відпочинок</button>
                    <button class="filter-btn" data-subject="cooking">Кулінарія</button>
                    <button class="filter-btn" data-subject="maps">Карти світу</button>
                    <button class="filter-btn" data-subject="art">Мистецтво</button>
                    <button class="filter-btn" data-subject="museums">Музеї</button>
                    <button class="filter-btn" data-subject="german_philosophy">Німецька філософія</button>
                    <!-- Replaced Philosophers with Science -->
                    <button class="filter-btn" data-subject="astrophysics">Астрофізика</button>
                    <button class="filter-btn" data-subject="genetics">Генетика</button>

                    <!-- Additional Rows (Curated) -->
                    <button class="filter-btn" data-subject="architecture">Архітектура</button>
                    <button class="filter-btn" data-subject="psychology">Психологія</button>
                    <button class="filter-btn" data-subject="mythology">Міфологія</button>
                    <button class="filter-btn" data-subject="egypt">Давній Єгипет</button>
                    <button class="filter-btn" data-subject="linguistics">Лінгвістика</button>
                    <button class="filter-btn" data-subject="botany">Ботаніка</button>
                    <button class="filter-btn" data-subject="cinema">Кіно</button>
                    <button class="filter-btn" data-subject="chess">Шахи</button>
                    <button class="filter-btn" data-subject="design">Дизайн</button>
                    <button class="filter-btn" data-subject="ai">Штучний Інтелект</button>
                    <button class="filter-btn" data-subject="oceanography">Океанографія</button>
                    <button class="filter-btn" data-subject="gardening">Садівництво</button>
                </div>
            </nav>

            <div class="search-bar">
                <input type="text" id="bookSearch" placeholder="Пошук книги, автора або теми...">
                <button id="searchBtn">Знайти</button>
            </div>
        </header>

        <main>
            <div id="loader" class="hidden">
                <div class="spinner"></div>
                <p>Гортаємо сторінки всесвіту...</p>
            </div>
            <div id="booksGrid" class="books-grid"></div>
        </main>

        <footer>
            <p>&copy; 2026 IBONARIUM Library. Powered by Open Library & Wikipedia API.</p>
        </footer>
    </div>

    <div id="bookModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
